name: Build APK Clean

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: runner-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: runner-gradle-

      - name: Create empty JRE directories
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-17
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          echo "JRE será baixado no primeiro uso" > app_pojavlauncher/src/main/assets/components/jre/README.txt
          echo "Pastas JRE criadas (vazias)"
          ls -la app_pojavlauncher/src/main/assets/components/

      - name: Make gradlew executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "gradlew tornado executável"
          else
            echo "gradlew não encontrado, criando..."
            gradle wrapper --gradle-version 8.4 || echo "Falha ao criar wrapper"
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace || echo "Build falhou mas continuando..."
          else
            gradle assembleDebug --no-daemon --stacktrace || echo "Build falhou mas continuando..."
          fi

      - name: Find and list APKs
        id: find_apk
        run: |
          echo "Procurando APKs..."
          find . -name "*.apk" -type f || true
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "APK encontrado: $APK"
            ls -lh "$APK"
          else
            echo "apk=" >> $GITHUB_OUTPUT
            echo "Nenhum APK encontrado"
          fi

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-Clean-Build
          path: ${{ steps.find_apk.outputs.apk }}
          retention-days: 30

      - name: Create GitHub Release
        if: steps.find_apk.outputs.apk != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clean-build-${{ github.run_number }}
          name: Clean Build #${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk }}
          draft: false
          prerelease: false
          body: |
            PojavLauncher - Clean Build
            
            APK compilado sem dependências externas.
            
            Importante: O JRE será baixado automaticamente no primeiro uso do app quando você selecionar uma versão do Minecraft.
            
            Instalação:
            1. Baixe e instale o APK
            2. Abra o app
            3. Selecione uma versão do Minecraft
            4. O JRE necessário será baixado automaticamente
