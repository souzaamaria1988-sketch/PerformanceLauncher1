name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-build-

      - name: Create JRE directories
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-17
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          echo "JRE sera baixado no primeiro uso" > app_pojavlauncher/src/main/assets/components/jre/README.txt

      - name: Create res directories
        run: |
          mkdir -p app_pojavlauncher/src/main/res/values
          mkdir -p app_pojavlauncher/src/main/res/drawable
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">PojavLauncher</string></resources>' > app_pojavlauncher/src/main/res/values/strings.xml

      - name: Make gradlew executable
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build falhou com código $BUILD_STATUS"
            tail -50 build.log
            exit 1
          fi

      - name: Find APK
        id: find_apk
        run: |
          echo "Procurando APK..."
          find . -name "*.apk" -type f
          APK=$(find . -name "*.apk" -path "*/debug/*" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "APK encontrado: $APK"
            ls -lh "$APK"
          else
            echo "apk=" >> $GITHUB_OUTPUT
            echo "Nenhum APK encontrado"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-APK
          path: ${{ steps.find_apk.outputs.apk }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PojavLauncher Build #${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk }}
          draft: false
          prerelease: false
          body: |
            APK compilado com sucesso.
            
            O JRE será baixado automaticamente no primeiro uso do app.
            
            Build gerado automaticamente pelo GitHub Actions.
