name: Build PojavLauncher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Baixar JRE 8 do Adoptium (OpenJDK público)
      - name: Download JRE 8 (Adoptium)
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          cd app_pojavlauncher/src/main/assets/components/jre
          wget -q https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u392-b08/OpenJDK8U-jre_aarch64_linux_hotspot_8u392b08.tar.gz -O jre8.tar.gz
          tar -xzf jre8.tar.gz
          mv jdk8u392-b08-jre jre8
          rm jre8.tar.gz
          echo "JRE 8 baixado com sucesso"

      # Baixar JRE 17 do Adoptium
      - name: Download JRE 17 (Adoptium)
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-17
          cd app_pojavlauncher/src/main/assets/components/jre-17
          wget -q https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.9%2B9/OpenJDK17U-jre_aarch64_linux_hotspot_17.0.9_9.tar.gz -O jre17.tar.gz
          tar -xzf jre17.tar.gz
          mv jdk-17.0.9+9-jre jre17
          rm jre17.tar.gz
          echo "JRE 17 baixado com sucesso"

      # Baixar JRE 21 do Adoptium
      - name: Download JRE 21 (Adoptium)
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          cd app_pojavlauncher/src/main/assets/components/jre-21
          wget -q https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.1%2B12/OpenJDK21U-jre_aarch64_linux_hotspot_21.0.1_12.tar.gz -O jre21.tar.gz
          tar -xzf jre21.tar.gz
          mv jdk-21.0.1+12-jre jre21
          rm jre21.tar.gz
          echo "JRE 21 baixado com sucesso"

      - name: Grant execute
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        continue-on-error: true

      - name: Find APK
        id: find
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
            ls -lh "$APK"
          else
            echo "apk=" >> $GITHUB_OUTPUT
            echo "No APK found"
            find . -name "*.apk" || echo "No APKs found anywhere"
          fi

      - name: Upload APK
        if: steps.find.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-with-JRE
          path: ${{ steps.find.outputs.apk }}

      - name: Create Release
        if: steps.find.outputs.apk != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PojavLauncher Build #${{ github.run_number }} (com JRE)
          files: ${{ steps.find.outputs.apk }}
          draft: false
          prerelease: false
