name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-v2-

      - name: Make gradlew executable
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "APK: $APK"
            ls -lh "$APK"
          else
            echo "apk=" >> $GITHUB_OUTPUT
            echo "ERRO: APK não encontrado"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-APK
          path: ${{ steps.find_apk.outputs.apk }}
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PojavLauncher Build #${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk }}
          draft: false
          prerelease: false
          body: |
            APK compilado com sucesso via GitHub Actions.
            
            Instalação:
            1. Baixe o APK
            2. Instale (ative fontes desconhecidas)
            3. Abra e jogue
