name: Build PojavLauncher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create JRE placeholder
        run: |
          echo "Criando placeholder para JREs..."
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          echo "JRE será baixado no primeiro uso do app" > app_pojavlauncher/src/main/assets/components/jre/README.txt
          ls -la app_pojavlauncher/src/main/assets/components/

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Find APK
        id: find
        run: |
          echo "Procurando APK..."
          APK=$(find . -name "*.apk" -path "*/debug/*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "✓ APK encontrado: $APK"
            ls -lh "$APK"
          else
            echo "apk=" >> $GITHUB_OUTPUT
            echo "✗ APK não encontrado"
            find . -name "*.apk" 2>/dev/null || echo "Nenhum APK encontrado"
          fi

      - name: Upload APK
        if: steps.find.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-APK
          path: ${{ steps.find.outputs.apk }}

      - name: Create Release
        if: steps.find.outputs.apk != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: ${{ steps.find.outputs.apk }}
          draft: false
          prerelease: false
          body: |
            ## PojavLauncher Build
            
            APK compilado automaticamente.
            
            **Nota:** O JRE será baixado automaticamente no primeiro uso do app.
