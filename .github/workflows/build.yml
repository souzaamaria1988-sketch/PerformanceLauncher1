name: Build PojavLauncher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Criar JRE placeholder (o build não precisa do JRE real)
      - name: Create JRE placeholder
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          echo "JRE placeholder - será baixado no primeiro uso" > app_pojavlauncher/src/main/assets/components/jre/README.txt

      - name: Grant execute
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Find APK
        id: find
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" | head -1)
          fi
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
          else
            echo "apk=" >> $GITHUB_OUTPUT
            echo "No APK found"
          fi

      - name: Upload APK
        if: steps.find.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-debug
          path: ${{ steps.find.outputs.apk }}

      - name: Create Release
        if: steps.find.outputs.apk != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PojavLauncher Build #${{ github.run_number }}
          files: ${{ steps.find.outputs.apk }}
          draft: false
          prerelease: false
