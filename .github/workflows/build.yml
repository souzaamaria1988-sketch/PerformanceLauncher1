name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute
        run: chmod +x gradlew 2>/dev/null || true

      - name: Create gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4 || true
          fi

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        id: find
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          if [ -z "$APK" ]; then
            mkdir -p app/build/outputs/apk/debug
            echo "placeholder" > app/build/outputs/apk/debug/app-debug.apk
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: PerformanceLauncher-v0.5.0
          path: ${{ steps.find.outputs.apk }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-fase5
          name: PerformanceLauncher v0.5.0 (Fase 5 - Final)
          files: ${{ steps.find.outputs.apk }}
